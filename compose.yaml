services:
  catalogo-db:
    image: postgres:17-alpine
    container_name: catalogo-db
    environment:
      POSTGRES_DB: ${CATALOGO_DB_NAME}
      POSTGRES_USER: ${CATALOGO_DB_USER}
      POSTGRES_PASSWORD: ${CATALOGO_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - catalogo-db-data:/var/lib/postgresql/data

volumes:
  catalogo-db-data: